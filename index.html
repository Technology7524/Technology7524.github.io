<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>네모 박스 만들기</title>
    <style>
        .box {
            width: 200px;           /* 박스의 가로 크기 */
            height: 200px;          /* 박스의 세로 크기 */
            background-color: lightblue; /* 배경색 */
            border: 2px solid black;     /* 테두리 (두께, 종류, 색상) */
            margin: 20px;           /* 바깥 여백 */
            padding: 15px;          /* 안쪽 여백 */
        }
    </style>
</head>
<body>

    <div class="box">
        여기는 네모 박스 안쪽입니다.
    </div>

</body>
</html>
